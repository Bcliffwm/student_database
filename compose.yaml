services:
  api:
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}

    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:${HOST_PORT}:8000"
    volumes:
      - university_data:/data

    restart: unless-stopped

volumes:
  university_data:
    external: true